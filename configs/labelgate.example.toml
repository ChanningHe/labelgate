# Labelgate Example Configuration (TOML) - v0.3
# Copy this file to labelgate.toml and customize as needed.
# All values can be overridden by environment variables with LABELGATE_ prefix.
# Naming rule: TOML path a.b.c -> ENV LABELGATE_A_B_C (lists: comma-separated).
# Unknown keys are errors. Values shown are the defaults unless marked "required".

# Core configuration
label_prefix = "labelgate"
log_level = "info"                # debug, info, warn, error
log_format = "text"               # text, json
mode = "main"                     # main, agent
# default_tunnel = ""             # "" or "default" = cloudflare.tunnel_id, else a key of cloudflare.tunnels
# instance_id = ""                # override the persisted instance ID (only for recovery after DB loss)
# skip_credential_validation = false

# Docker Provider configuration (unix:// and tcp:// only; ssh:// was removed in v0.3)
[docker]
endpoint = "unix:///var/run/docker.sock"
poll_interval = "2m"
# filter_label = "labelgate.enable=true"

# [docker.tls]
# ca = "/path/to/ca.pem"
# cert = "/path/to/cert.pem"
# key = "/path/to/key.pem"
# insecure_skip_verify = false  # NOT recommended

# Cloudflare configuration
[cloudflare]
api_token = "your-api-token-here"   # required
account_id = "your-account-id"
tunnel_id = "your-tunnel-id"        # requires account_id

# Additional named credentials (for multi-account)
# [cloudflare.credentials.personal]
# api_token = "personal-token"
# zones = ["example.com", "*.example.com"]

# Additional named tunnels (beyond the root tunnel)
# [cloudflare.tunnels.secondary]
# account_id = "account-id-2"
# tunnel_id = "tunnel-id-2"
# credential = "personal"

# Sync configuration (reconciliation + resource lifecycle)
[sync]
interval = "5m"            # >= 10s
remove_delay = "30m"       # delay before deleting orphaned resources (cleanup=true)
orphan_ttl = "0s"          # 0 = never drop DB rows of orphaned resources with cleanup=false
agent_grace = "24h"        # keep an offline agent's resources for this long (>= 5m)

# Retry configuration (general retry policy for API calls and reconnection)
[retry]
attempts = 3
delay = "1s"
max_delay = "30s"
backoff = 2.0

# Database configuration
# (db.retention and db.vacuum_interval were removed in v0.3 and fail validation)
[db]
path = "/app/config/labelgate.db"

# HTTP API and dashboard configuration
# token is REQUIRED (>= 16 characters, e.g. openssl rand -hex 32): if it is empty, the API and the dashboard are disabled.
# The dashboard follows base_path automatically (the server injects it into the page).
[api]
enabled = true
address = ":28111"
base_path = "/api"
token = "change-me-to-a-long-random-string"   # prefer LABELGATE_API_TOKEN

# Agent management (for the main instance)
[agent]
enabled = false
listen = ":28112"          # agents connect to wss://<host>:28112/ws
# accept_token = ""        # shared token, >= 32 characters, >= 12 distinct; prefer per-agent tokens
# accept_hostnames = ["*.remote.example.com"]
# accept_tunnels = []
# accept_services = ["web", "172.20.0.0/16"]   # tunnel origins beyond IP literals

# [agent.tls]
# cert = "/path/to/cert.pem"   # server certificate of the agent listener
# key = "/path/to/key.pem"
# ca = "/path/to/ca.pem"       # verifies inbound agents when the main dials them
# insecure_skip_verify = false # NOT recommended

# Pre-configured agents (tokens >= 32 characters, >= 12 distinct: openssl rand -hex 32). The key is the agent ID: ^[a-z0-9][a-z0-9._-]{0,62}$
# [agent.agents.remote-host-1]
# token = "replace-with-openssl-rand-hex-32"
# name = "Remote host 1"
# default_tunnel = "default"
# tunnels = ["default"]
# hostnames = ["*.remote.example.com"]
# services = ["web", "172.20.0.0/16"]        # tunnel origins beyond IP literals
# connect_to = "wss://remote-host-1:28113/ws"   # inbound mode

# Agent connection (when mode = "agent")
# [connect]
# mode = "outbound"                              # outbound, inbound
# endpoint = "wss://main.example.com:28112/ws"    # outbound; the /ws path is required
# listen = ":28113"                               # inbound
# token = "replace-with-openssl-rand-hex-32"              # required
# agent_id = ""                                  # default: first 12 hex chars of /etc/machine-id (mount it into the container), else the hostname (not stable, warns)
# heartbeat_interval = "30s"

# [connect.tls]
# ca = "/path/to/ca.pem"       # verifies the main when dialing it (default: system roots)
# cert = "/path/to/cert.pem"   # server certificate of the inbound listener
# key = "/path/to/key.pem"
# insecure_skip_verify = false # NOT recommended
