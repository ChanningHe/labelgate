name: Docs

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Only stable vX.Y.Z tags deploy; anything else fails (or, for pre-releases, is skipped)
  # so a stray tag can never overwrite the published docs.
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.parse.outputs.prerelease }}
    steps:
      - name: Parse tag
        id: parse
        env:
          TAG: ${{ github.ref_name }}
        run: |
          re='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if [[ ! "$TAG" =~ $re ]]; then
            echo "::error::Tag '$TAG' does not match vX.Y.Z or vX.Y.Z-suffix"
            exit 1
          fi
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  # No secrets here: dependency install scripts must never run next to the Cloudflare token.
  # docsite has no lifecycle scripts of its own (fumadocs-mdx generates .source during
  # `next build`), so --ignore-scripts skips only third-party hooks (esbuild's optional
  # postinstall); the build is verified to work without them.
  build:
    name: Build docs
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.prerelease == 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: docsite/yarn.lock

      - name: Install and build
        working-directory: docsite
        run: |
          yarn install --frozen-lockfile --ignore-scripts
          yarn build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: docsite/out
          if-no-files-found: error
          retention-days: 1

  # Holds the Cloudflare secrets: no checkout, no dependency install, only the built output.
  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-site
          path: docsite/out

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docsite/out --project-name=labelgate-docs --branch=tags
