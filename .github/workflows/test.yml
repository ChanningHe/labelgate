name: Test

# Lint and test only; this workflow never publishes anything.
# Runs on every pull request (including Renovate's) and is called by
# ci.yml and release.yml so binaries and images are only built from code that passes.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  # renovate: datasource=go depName=honnef.co/go/tools
  STATICCHECK_VERSION: v0.8.2
  # renovate: datasource=go depName=golang.org/x/vuln
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  dashboard:
    name: Dashboard lint, tests and type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: dashboard/yarn.lock

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test

      # tsc -b runs as part of the build; the output is discarded here.
      - name: Type check and build
        run: yarn build

  # docs.yml only runs on tags, so dependency bumps would otherwise first
  # break the docsite at release time.
  docsite:
    name: Docsite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docsite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: docsite/yarn.lock

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Type check and build
        run: yarn build

  go:
    name: Go lint, vulncheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          check-latest: false

      # dashboard/embed.go embeds dashboard/static, which only exists after a
      # frontend build. Tests don't use the assets, so a placeholder is enough.
      - name: Placeholder dashboard assets
        run: |
          mkdir -p dashboard/static
          echo '<html><body>Dashboard not built</body></html>' > dashboard/static/index.html

      # Only tracked files, so docsite/dashboard node_modules are never scanned.
      - name: Check formatting
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted" | while read -r f; do
              echo "::error file=$f::File is not gofmt-formatted"
            done
            echo "Run gofmt -w on the files above."
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # Tool versions are pinned; Renovate bumps them via the env block below.
      - name: Staticcheck
        run: go run "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}" ./...

      - name: Govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

      - name: Test
        run: go test -race ./...
