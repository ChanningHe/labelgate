name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/channinghe/labelgate
  BASE_NONROOT: gcr.io/distroless/static-debian13:nonroot@sha256:aafe993665bf6200db38a02c11a9351e782a84b6a45e7f33b6695638c88e3931
  BASE_DEBUG: gcr.io/distroless/static-debian13:debug-nonroot@sha256:7df9fac2f5d3927260696af33fc2391da26366825838a47337088ed78f854a0c

jobs:
  # Fail fast on tags that are not vX.Y.Z or vX.Y.Z-prerelease. Stable tags publish
  # vX.Y.Z and vX.Y; pre-releases publish only the exact tag. vX is never moved.
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.parse.outputs.prerelease }}
      minor: ${{ steps.parse.outputs.minor }}
    steps:
      - name: Parse tag
        id: parse
        env:
          TAG: ${{ github.ref_name }}
        run: |
          re='^v([0-9]+)\.([0-9]+)\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if [[ ! "$TAG" =~ $re ]]; then
            echo "::error::Tag '$TAG' does not match vX.Y.Z or vX.Y.Z-suffix"
            exit 1
          fi
          if [ -n "${BASH_REMATCH[3]}" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "minor=" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "minor=v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          fi

  # Tags can be cut from commits CI never saw, so releases run the tests too.
  test:
    name: Test
    needs: validate
    uses: ./.github/workflows/test.yml

  # Phase 1: Build dashboard frontend once
  dashboard:
    name: Build Dashboard
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: dashboard/yarn.lock

      - name: Build dashboard
        working-directory: dashboard
        run: |
          yarn install --frozen-lockfile
          yarn build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-static
          path: dashboard/static
          retention-days: 1

  # Phase 2: Cross-compile Go binaries (native speed, no QEMU)
  binaries:
    name: Binary ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: [test, dashboard]
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dashboard-static
          path: dashboard/static

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          check-latest: false

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          BUILD_DATE=$(date -u -d "@$(git log -1 --format=%ct)" +%Y-%m-%dT%H:%M:%SZ)
          go build -trimpath \
            -ldflags "-s -w \
              -X github.com/channinghe/labelgate/internal/version.Version=${VERSION} \
              -X github.com/channinghe/labelgate/internal/version.Commit=${GITHUB_SHA} \
              -X github.com/channinghe/labelgate/internal/version.Date=${BUILD_DATE}" \
            -o "labelgate-${GOOS}-${GOARCH}" \
            ./cmd/labelgate

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: labelgate-${{ matrix.goos }}-${{ matrix.goarch }}
          path: labelgate-${{ matrix.goos }}-${{ matrix.goarch }}

  # Phase 3: Package pre-built binaries into multi-arch Docker images
  docker:
    name: Docker${{ matrix.suffix }}
    runs-on: ubuntu-latest
    needs: [validate, binaries]
    # Only this job pushes images; everything that runs package-manager code stays read-only.
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - suffix: ""
            base_image_env: BASE_NONROOT
          - suffix: "-full"
            base_image_env: BASE_DEBUG
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: labelgate-linux-*
          path: docker-context
          merge-multiple: true

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags
        id: tags
        env:
          VERSION: ${{ github.ref_name }}
          MINOR: ${{ needs.validate.outputs.minor }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          TAGS="${IMAGE_BASE}:${VERSION}${SUFFIX}"
          if [ -n "$MINOR" ]; then
            TAGS="${TAGS},${IMAGE_BASE}:${MINOR}${SUFFIX}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Set base image
        id: base
        run: |
          if [ "${{ matrix.base_image_env }}" = "BASE_NONROOT" ]; then
            echo "image=${{ env.BASE_NONROOT }}" >> "$GITHUB_OUTPUT"
          else
            echo "image=${{ env.BASE_DEBUG }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker-context
          file: docker/ci.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.image }}
          cache-from: type=gha,scope=release${{ matrix.suffix || '-default' }}
          cache-to: type=gha,mode=max,scope=release${{ matrix.suffix || '-default' }}

  # Create GitHub Release with binaries
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, docker, binaries]
    # Only this job creates the release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: labelgate-*
          merge-multiple: true

      - name: Generate release body
        id: body
        run: |
          VERSION="${GITHUB_REF_NAME}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || echo "")

          {
            echo "body<<RELEASE_EOF"

            if [ -n "$PREV_TAG" ]; then
              echo "## Changes since ${PREV_TAG}"
              echo ""
              git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD"
            else
              echo "## Changes"
              echo ""
              git log --pretty=format:"- %s (%h)" HEAD
            fi

            cat <<'COMPOSE'

          ## Deploy with Docker Compose

          ```yaml
          services:
            labelgate:
              image: ghcr.io/channinghe/labelgate:VERSION_PLACEHOLDER
              container_name: labelgate
              restart: unless-stopped
              # use command "stat -c '%g' /var/run/docker.sock" to get the group id of the docker socket
              group_add:
                - "REPLACE_WITH_GROUP_ID"
              volumes:
                - /var/run/docker.sock:/var/run/docker.sock:ro
                # Run the command "sudo chown -R 65532:65532 ./labelgate-data" to ensure the mount path has the correct ownership.
                - ./labelgate-data:/app/config
              environment:
                - LABELGATE_CLOUDFLARE_API_TOKEN
                - LABELGATE_CLOUDFLARE_ACCOUNT_ID
                - LABELGATE_CLOUDFLARE_TUNNEL_ID
              ports:
                - "28111:28111"
              network_mode: bridge
          ```
          COMPOSE

            echo ""
            echo "RELEASE_EOF"
          } >> "$GITHUB_OUTPUT"

          sed -i "s|VERSION_PLACEHOLDER|${VERSION}|g" "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body: ${{ steps.body.outputs.body }}
          generate_release_notes: false
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          files: artifacts/*
