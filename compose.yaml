services:
  # Main Labelgate instance
  labelgate:
    image: ghcr.io/channinghe/labelgate:${LABELGATE_VERSION:-v0.3}
    container_name: labelgate
    restart: unless-stopped

    # use command "stat -c '%g' /var/run/docker.sock" to get the group id of the docker socket
    group_add:
      - "REPLACE_WITH_GROUP_ID"
    volumes:
      # Docker socket for container monitoring
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Persistent storage. The container runs as UID 65532: run
      # "sudo chown -R 65532:65532 ./labelgate-data" once so it can write the database.
      - ./labelgate-data:/app/config
      
      # Optional: custom config file
      # - ./labelgate.yaml:/etc/labelgate/labelgate.yaml:ro
    
    environment:
      # Cloudflare credentials (required)
      - LABELGATE_CLOUDFLARE_API_TOKEN=${LABELGATE_CLOUDFLARE_API_TOKEN}
      - LABELGATE_CLOUDFLARE_ACCOUNT_ID=${LABELGATE_CLOUDFLARE_ACCOUNT_ID}
      - LABELGATE_CLOUDFLARE_TUNNEL_ID=${LABELGATE_CLOUDFLARE_TUNNEL_ID}

      # API and dashboard bearer token (>= 16 chars; generate: openssl rand -hex 32).
      # Required for the API and dashboard; if empty, both are disabled.
      - LABELGATE_API_TOKEN=${LABELGATE_API_TOKEN}
      
      # Optional settings
      - LABELGATE_LOG_LEVEL=${LABELGATE_LOG_LEVEL:-info}
      - LABELGATE_LOG_FORMAT=${LABELGATE_LOG_FORMAT:-text}
      
      # Database path (inside container)
      - LABELGATE_DB_PATH=/app/config/labelgate.db
    
    ports:
      # HTTP API and dashboard (authenticated with LABELGATE_API_TOKEN).
      # Bound to localhost on purpose: put TLS, a VPN or Cloudflare Access in front before exposing it.
      - "127.0.0.1:28111:28111"
      # Agent server (needs LABELGATE_AGENT_ENABLED=true; agents connect to wss://<host>:28112/ws)
      # - "28112:28112"
    
    # labels:
    #   # Self-monitoring example (optional)
    #   labelgate.dns.api.hostname: api.example.com
    #   labelgate.dns.api.type: A
    #   labelgate.dns.api.target: auto
    #   labelgate.dns.api.proxied: "true"

networks:
  default:
    name: labelgate-network
